name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Run workflow manually
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["main", "master"]}

jobs:

  # ═══════════════════════════════════════
  # Header & Base stats
  # ═══════════════════════════════════════
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.header.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo

  # ═══════════════════════════════════════
  # Isometric Commit Calendar
  # ═══════════════════════════════════════
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ═══════════════════════════════════════
  # Languages
  # ═══════════════════════════════════════
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30

  # ═══════════════════════════════════════
  # Starred Topics (as mastered technologies)
  # ═══════════════════════════════════════
  topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          plugin_topics_sort: stars

  # ═══════════════════════════════════════
  # Recently Starred Repositories
  # ═══════════════════════════════════════
  stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4

  # ═══════════════════════════════════════
  # Coding Habits
  # ═══════════════════════════════════════
  habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_from: 200
          config_timezone: Asia/Tokyo

  # ═══════════════════════════════════════
  # Follow-up of Issues & PRs
  # ═══════════════════════════════════════
  followup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_followup: yes
          plugin_followup_indepth: yes

  # ═══════════════════════════════════════
  # Achievement Badges
  # ═══════════════════════════════════════
  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

  # ═══════════════════════════════════════
  # Notable Contributions
  # ═══════════════════════════════════════
  notable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: ""
          plugin_notable: yes
          plugin_notable_repositories: yes

  # ═══════════════════════════════════════
  # Lines of Code Changed
  # ═══════════════════════════════════════
  lines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ReaseySereiNeath
          base: repositories
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
